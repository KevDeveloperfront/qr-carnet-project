<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ficha - {{nombre}}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-sm">
    <section class="bg-white rounded-2xl shadow-lg p-6 space-y-5">

      <!-- Header -->
      <div class="flex items-center gap-4">
        <div class="w-20 h-20 rounded-full bg-slate-200 flex items-center justify-center">
          <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12z"/>
            <path d="M4 20c0-3.3 4.5-6 8-6s8 2.7 8 6"/>
          </svg>
        </div>

        <div class="flex-1">
          <h1 class="text-xl font-semibold text-slate-800">{{nombre}}</h1>
          <p class="text-sm text-slate-500">{{rango}} • {{comando}}</p>
        </div>
      </div>

      <!-- Info -->
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div>
          <p class="text-slate-400 text-xs">Tipo de sangre</p>
          <p class="font-medium">{{tipo_sangre}}</p>
        </div>
        <div>
          <p class="text-slate-400 text-xs">Alergias</p>
          <p class="font-medium">{{alergias}}</p>
        </div>
      </div>

      <!-- Condiciones -->
      <div class="bg-slate-50 rounded-lg p-3">
        <p class="text-xs text-slate-400">Condiciones médicas</p>
        <p class="text-sm mt-1">{{condiciones_medicas}}</p>
      </div>

      <!-- Contactos -->
      <div class="border rounded-lg p-3">
        <p class="text-xs text-slate-400 mb-1">Contactos de emergencia</p>
        <pre class="text-sm whitespace-pre-line">{{contactos}}</pre>
      </div>

      <!-- Footer -->
      <div class="text-center text-xs text-slate-400 pt-2">
        Ficha generada por tu organización
      </div>

    </section>
  </main>

</body>
</html>
