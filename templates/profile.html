<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ficha - {{nombre}}</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen p-6">
  <main class="max-w-md mx-auto">
    <section class="bg-white rounded-2xl shadow-md p-6">
      <div class="flex items-center gap-4">
         <div class="w-20 h-20 rounded-full bg-slate-100 flex items-center justify-center">
           <!-- simple avatar icon -->
           <svg class="w-10 h-10 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
             <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12z"></path>
             <path d="M4 20c0-3.3 4.5-6 8-6s8 2.7 8 6"></path>
           </svg>
         </div>
         <div class="flex-1">
           <h1 class="text-xl font-semibold">{{nombre}}</h1>
           <div class="text-sm text-slate-500">{{rango}} • {{comando}}</div>
         </div>
         <div class="text-right">
           <div class="text-xs text-slate-400">Ficha</div>
           <div class="text-xs text-slate-400 mt-1"><a href="/qr/{{id}}/pdf" class="text-indigo-600 hover:underline">Descargar PDF</a></div>
         </div>
      </div>

      <div class="mt-6 grid gap-3">
         <div class="flex items-center justify-between">
           <div>
             <div class="text-xs text-slate-500">Tipo de sangre</div>
             <div class="font-medium">{{tipo_sangre}}</div>
           </div>
           <div class="text-right">
             <div class="text-xs text-slate-500">Alergias</div>
             <div class="font-medium">{{alergias}}</div>
           </div>
         </div>

         <div class="p-3 bg-slate-50 rounded">
           <div class="text-xs text-slate-500">Condiciones médicas</div>
           <div class="mt-1 text-sm">{{condiciones}}</div>
         </div>

         <div class="p-3 rounded border">
           <div class="flex items-start justify-between">
             <div>
               <div class="text-xs text-slate-500">Contactos de emergencia</div>
               <div class="mt-1 text-sm whitespace-pre-line">{{contactos}}</div>
             </div>
             <div class="ml-4">
               <svg class="w-8 h-8 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                 <path d="M22 16.92V21a1 1 0 0 1-1.09 1A19 19 0 0 1 3 5.09 1 1 0 0 1 4 4h4.09a1 1 0 0 1 1 .77c.12.92.36 1.8.69 2.63a1 1 0 0 1-.24 1L8.91 11.09a14 14 0 0 0 4 4l1.69-1.63a1 1 0 0 1 1-.24c.83.33 1.7.57 2.63.69a1 1 0 0 1 .77 1V20z"></path>
               </svg>
             </div>
           </div>
         </div>
      </div>

      <div class="mt-6 text-xs text-slate-400 text-center">Ficha generada por tu organización</div>
    </section>
  </main>
</body>
</html>
